<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spice & Bites — Restaurant Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17150F;
    --bg-alt:#1F1C15;
    --panel:#241F17;
    --cream:#F3ECD9;
    --cream-dim:#C9BFA0;
    --amber:#D89B3C;
    --amber-dark:#A66C1E;
    --red:#B8402F;
    --green:#6E8B5A;
    --line:#3A362A;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(216,155,60,0.07), transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(184,64,47,0.06), transparent 40%);
    color:var(--cream);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:0.2px;}
  p{margin:0;}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select{font-family:var(--font-body);}
  ::selection{background:var(--amber); color:var(--bg);}

  /* ---------- Header ---------- */
  .rail-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 32px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(31,28,21,0.9), rgba(31,28,21,0.4));
    gap:16px; flex-wrap:wrap;
  }
  @media (max-width:640px){
    .rail-header{padding:18px 18px 20px;}
    .brand{width:100%; justify-content:space-between;}
    .brand h1{font-size:20px;}
    .header-status{width:100%; justify-content:flex-end;}
    .admin-quick-link{top:10px; right:10px; padding:5px 8px; font-size:9px;}
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    width:44px; height:44px; border-radius:14px;
    background:linear-gradient(135deg, var(--amber), var(--red));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; color:var(--bg); font-size:18px;
    box-shadow:0 10px 22px rgba(216,155,60,0.22);
    transform:rotate(-7deg);
  }
  .brand h1{font-size:24px; letter-spacing:0.5px;}
  .brand span{font-family:var(--font-mono); font-size:11px; color:var(--cream-dim); letter-spacing:2px; text-transform:uppercase;}
  .header-status{font-family:var(--font-mono); font-size:12px; color:var(--cream-dim); display:flex; gap:8px; align-items:center;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);}
  .admin-quick-link{
    position:fixed; top:16px; right:16px; z-index:1100;
    border:none; background:rgba(36,31,23,0.86); color:var(--cream-dim);
    border:1px solid rgba(255,255,255,0.08); border-radius:999px;
    padding:6px 10px; font-size:10px; letter-spacing:2px; text-transform:uppercase;
    font-family:var(--font-mono); opacity:.6; transition:.2s;
  }
  .admin-quick-link:hover{opacity:1; color:var(--amber); border-color:var(--amber);}

  /* ---------- Layout ---------- */
  #app{max-width:1180px; margin:0 auto; padding:0 24px 80px;}
  @media (max-width:640px){#app{padding:0 16px 60px;}}
  .screen{animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Home / role choice ---------- */
  .home-hero{padding:70px 0 24px; text-align:center;}
  .home-hero .eyebrow{font-family:var(--font-mono); color:var(--amber); letter-spacing:3px; font-size:12px; text-transform:uppercase;}
  .home-hero h2{font-size:clamp(32px,5vw,54px); margin-top:14px; line-height:1.08;}
  .home-hero .sub{color:var(--cream-dim); margin-top:16px; max-width:590px; margin-left:auto; margin-right:auto; font-size:15px; line-height:1.75;}
  .hero-banner{
    margin:12px auto 0; max-width:880px; padding:26px 28px; border-radius:18px;
    background:linear-gradient(135deg, rgba(216,155,60,0.16), rgba(184,64,47,0.12));
    border:1px solid rgba(216,155,60,0.22); display:grid; gap:12px;
  }
  .hero-banner .mini{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:2px; color:var(--amber); font-size:11px;}
  .hero-banner .big{font-family:var(--font-display); font-size:clamp(20px,3vw,28px); color:var(--cream);}
  .hero-banner .small{color:var(--cream-dim); font-size:14px; line-height:1.6;}
  .featured-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px;}
  @media (max-width:760px){.featured-strip{grid-template-columns:1fr;}}
  .feature-pill{padding:14px 16px; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid var(--line);}
  .feature-pill strong{display:block; font-size:15px; color:var(--cream); margin-bottom:4px;}
  .feature-pill span{font-size:13px; color:var(--cream-dim);}
  .role-grid{display:grid; grid-template-columns:1fr; gap:22px; margin-top:28px; max-width:760px; margin-left:auto; margin-right:auto;}
  @media (max-width:640px){.home-hero{padding:48px 0 28px;} .home-hero h2{font-size:clamp(28px,7vw,38px);} .role-card{padding:24px 20px;}}
  .role-card{
    background:linear-gradient(135deg, rgba(36,31,23,0.98), rgba(28,24,18,0.98));
    border:1px solid var(--line); border-radius:14px;
    padding:32px 28px; text-align:left; cursor:pointer; transition:.25s; position:relative; overflow:hidden;
    box-shadow:0 18px 35px rgba(0,0,0,0.25);
  }
  .role-card::before{content:""; position:absolute; inset:auto -20px -20px auto; width:140px; height:140px; background:radial-gradient(circle, rgba(216,155,60,0.16), transparent 70%);}
  .role-card:hover{border-color:var(--amber); transform:translateY(-3px); box-shadow:0 20px 40px rgba(0,0,0,0.3);}
  .role-card:active{transform:translateY(0) scale(0.99);}
  .role-card .num{font-family:var(--font-mono); color:var(--amber-dark); font-size:12px;}
  .role-card h3{font-size:24px; margin-top:10px;}
  .role-card p{color:var(--cream-dim); font-size:13.5px; margin-top:8px; line-height:1.5;}
  .role-card .go{margin-top:18px; font-family:var(--font-mono); font-size:12px; color:var(--amber); letter-spacing:1px;}

  /* ---------- Ticket / Card ---------- */
  .ticket{
    background:var(--cream); color:#1c1a14; border-radius:2px;
    padding:26px 24px; position:relative;
    clip-path: polygon(0% 0%, 100% 0%, 100% 96%, 96% 100%, 92% 96%, 88% 100%, 84% 96%, 80% 100%, 76% 96%, 72% 100%, 68% 96%, 64% 100%, 60% 96%, 56% 100%, 52% 96%, 48% 100%, 44% 96%, 40% 100%, 36% 96%, 32% 100%, 28% 96%, 24% 100%, 20% 96%, 16% 100%, 12% 96%, 8% 100%, 4% 96%, 0% 100%);
    padding-bottom:34px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
  }
  .ticket-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px dashed #9c9276; padding-bottom:12px; margin-bottom:12px;}
  .ticket-head h3{font-size:18px;}
  .ticket-head .tag{font-family:var(--font-mono); font-size:11px; background:#1c1a14; color:var(--cream); padding:3px 8px; border-radius:20px;}
  .ticket-row{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:13px; padding:4px 0; color:#3a3626;}
  .ticket-row.total{border-top:1px dashed #9c9276; margin-top:8px; padding-top:10px; font-weight:600; font-size:15px; color:#1c1a14;}

  /* ---------- Panels / forms ---------- */
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:28px; box-shadow:0 10px 24px rgba(0,0,0,0.16);}
  .panel + .panel{margin-top:18px;}
  .panel-title{font-size:20px; margin-bottom:4px;}
  .panel-sub{color:var(--cream-dim); font-size:13px; margin-bottom:20px;}
  .tabs{display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:0;}
  .tab-btn{
    background:transparent; border:none; color:var(--cream-dim); padding:10px 16px;
    font-size:13.5px; font-weight:500; border-bottom:2px solid transparent; transition:.15s;
  }
  .tab-btn:hover{color:var(--cream);}
  .tab-btn.active{color:var(--amber); border-bottom-color:var(--amber);}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; color:var(--cream-dim); margin-bottom:6px; font-family:var(--font-mono); letter-spacing:0.5px;}
  .field input, .field select{
    width:100%; padding:11px 13px; background:var(--bg-alt); border:1px solid var(--line);
    color:var(--cream); border-radius:4px; font-size:14px; outline:none; transition:.15s;
  }
  .field input:focus, .field select:focus{border-color:var(--amber);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 20px; border-radius:4px; border:1px solid transparent; font-size:14px; font-weight:600;
    transition:.15s;
  }
  .btn-primary{background:var(--amber); color:#1c1a14;}
  .btn-primary:hover{background:#e8ac57;}
  .btn-outline{background:transparent; border-color:var(--line); color:var(--cream);}
  .btn-outline:hover{border-color:var(--amber); color:var(--amber);}
  .btn-danger{background:transparent; border-color:var(--red); color:var(--red);}
  .btn-danger:hover{background:var(--red); color:var(--cream);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px; font-size:12.5px;}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- Menu grid ---------- */
  .menu-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .food-card{
    background:linear-gradient(180deg, rgba(31,28,21,0.98), rgba(24,20,15,0.98));
    border:1px solid var(--line); border-radius:10px; padding:16px;
    display:flex; flex-direction:column; gap:10px;
    transition:transform .2s ease, border-color .2s ease;
  }
  .food-card:hover{transform:translateY(-2px); border-color:var(--amber);}
  .food-card h4{font-size:16px;}
  .food-card .price{font-family:var(--font-mono); color:var(--amber); font-size:15px;}
  .qty-row{display:flex; align-items:center; gap:8px;}
  .qty-btn{width:30px; height:30px; border-radius:4px; border:1px solid var(--line); background:transparent; color:var(--cream); font-size:16px; line-height:1;}
  .qty-btn:hover{border-color:var(--amber); color:var(--amber);}
  .qty-val{font-family:var(--font-mono); min-width:24px; text-align:center;}

  /* ---------- Cart drawer ---------- */
  .order-layout{display:grid; grid-template-columns:1.6fr 1fr; gap:22px; align-items:start;}
  @media(max-width:860px){.order-layout{grid-template-columns:1fr;}}
  @media(max-width:640px){.cart-box{position:static;} .food-card{padding:14px;} .menu-grid{grid-template-columns:1fr;}}
  .cart-box{position:sticky; top:20px;}
  .cart-item{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .cart-item .meta{color:var(--cream-dim); font-family:var(--font-mono); font-size:12px;}
  .empty-note{color:var(--cream-dim); font-size:13px; font-style:italic; padding:14px 0;}

  /* ---------- Table ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-family:var(--font-mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--amber-dark); padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .status-pill{font-family:var(--font-mono); font-size:11px; padding:3px 9px; border-radius:20px; display:inline-block;}
  .status-Pending{background:rgba(216,155,60,0.15); color:var(--amber);}
  .status-Ready{background:rgba(110,139,90,0.18); color:var(--green);}
  .status-Completed{background:rgba(255,255,255,0.08); color:var(--cream-dim);}

  /* ---------- Stats ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px;}
  .stat-card{background:var(--bg-alt); border:1px solid var(--line); border-radius:6px; padding:18px;}
  .stat-card .n{font-family:var(--font-display); font-size:28px; color:var(--amber);}
  .stat-card .l{font-family:var(--font-mono); font-size:11px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}

  /* ---------- Admin layout ---------- */
  .admin-layout{display:grid; grid-template-columns:190px 1fr; gap:22px; align-items:start;}
  @media(max-width:760px){.admin-layout{grid-template-columns:1fr;}}
  .admin-nav{position:sticky; top:20px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:2px; box-shadow:0 10px 24px rgba(0,0,0,0.16);}
  .admin-nav button{
    text-align:left; background:transparent; border:none; color:var(--cream-dim); padding:11px 12px;
    border-radius:4px; font-size:13.5px; font-weight:500; position:relative;
  }
  .admin-nav button.active{background:rgba(216,155,60,0.1); color:var(--amber);}
  .admin-nav button:hover{color:var(--cream);}

  .backlink{display:inline-flex; align-items:center; gap:6px; color:var(--cream-dim); font-size:13px; margin-bottom:20px; background:none; border:none; font-family:var(--font-mono);}
  .backlink:hover{color:var(--amber);}

  /* ---------- Toast ---------- */
  #toast-wrap{position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--amber);
    color:var(--cream); padding:13px 18px; border-radius:4px; font-size:13.5px; min-width:230px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); animation:slideIn .25s ease;
  }
  .toast.err{border-left-color:var(--red);}
  .toast.ok{border-left-color:var(--green);}
  @keyframes slideIn{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}

  .empty-state{text-align:center; padding:40px 20px; color:var(--cream-dim);}
  .empty-state .glyph{font-size:30px; margin-bottom:10px;}

  .divider{height:1px; background:var(--line); margin:22px 0;}
  .hint{font-size:12px; color:var(--cream-dim); margin-top:6px;}
  .link-btn{background:none; border:none; color:var(--amber); font-size:13px; font-weight:600; padding:0;}
  .modal-overlay{position:fixed; inset:0; background:rgba(10,9,6,0.7); display:flex; align-items:center; justify-content:center; z-index:900; padding:20px;}
  .modal-box{max-width:420px; width:100%;}
  .site-footer{
    max-width:1180px; margin:0 auto; padding:24px 24px 44px; display:flex; justify-content:space-between;
    align-items:center; gap:16px; flex-wrap:wrap; color:var(--cream-dim); font-size:13px; border-top:1px solid var(--line);
  }
  @media (max-width:640px){.site-footer{padding:20px 16px 36px; flex-direction:column; align-items:flex-start;}}
  .site-footer strong{color:var(--cream); font-family:var(--font-display); font-size:16px;}
</style>
</head>
<body>

<button class="admin-quick-link" data-go="admin-login" title="Staff access">Staff</button>

<div class="rail-header">
  <div class="brand">
    <div class="mark">SB</div>
    <div>
      <h1>Spice &amp; Bites</h1>
      <span>Kitchen &amp; Front-of-House</span>
    </div>
  </div>
  <div class="header-status"><span class="dot"></span><span id="status-text">Loading data…</span></div>
</div>

<div id="app"><div id="screen"></div></div>
<div class="site-footer">
  <div>
    <strong>Spice &amp; Bites</strong>
    <div>Fresh dishes • Warm service • Smooth kitchen flow</div>
  </div>
  <div>Open Daily · 11:00 AM – 11:00 PM</div>
  <div>Contact: +92 300 1234567 · Lahore</div>
</div>
<div id="toast-wrap"></div>

<script>
/* =========================================================
   STATE + PERSISTENCE
   ========================================================= */
const S = {
  menu: { "Burger": 400, "Pizza": 2000 },
  orders: [],
  customers: [],
  adminPassword: "1278",
  currentCustomer: null,
  cart: [],
  ready: false
};

function toast(msg, type="ok"){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='err' ? 'err' : type==='info' ? '' : 'ok');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

async function loadState(){
  try{
    let dataRaw = null;
    if(window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get('restaurant-data', true);
      if(r && r.value) dataRaw = r.value;
    }
    if(!dataRaw){
      dataRaw = localStorage.getItem('restaurant-data');
    }
    if(dataRaw){
      const d = JSON.parse(dataRaw);
      S.menu = d.menu || S.menu;
      S.orders = d.orders || [];
      S.customers = d.customers || [];
      S.adminPassword = d.adminPassword || "1278";
    }
  }catch(e){ /* no data yet, defaults stand */ }
  S.ready = true;
  document.getElementById('status-text').textContent = 'Data loaded · saved automatically';
}

async function saveState(){
  const payload = JSON.stringify({
    menu: S.menu, orders: S.orders, customers: S.customers, adminPassword: S.adminPassword
  });
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set('restaurant-data', payload, true);
    }
    localStorage.setItem('restaurant-data', payload);
  }catch(e){
    toast('Could not save data — check connection', 'err');
  }
}

function nextOrderNumber(){
  if(S.orders.length===0) return 1001;
  return S.orders[S.orders.length-1].orderNumber + 1;
}
function money(n){ return "Rs " + Math.round(n*100)/100; }

/* =========================================================
   ROUTER
   ========================================================= */
const screen = document.getElementById('screen');
function go(html){ screen.innerHTML = html; window.scrollTo({top:0, behavior:'smooth'}); }

/* =========================================================
   HOME
   ========================================================= */
function renderHome(){
  go(`
  <div class="screen">
    <div class="home-hero">
      <div class="eyebrow">Authentic flavors • refined service</div>
      <h2>Elevated dining starts<br>with one seamless order.</h2>
      <p class="sub">Welcome to Spice &amp; Bites — a polished dining experience where every order is handled with care, every ticket stays connected, and every guest feels at home.</p>
    </div>
    <div class="hero-banner">
      <div class="mini">Signature experience</div>
      <div class="big">Fresh ingredients, fast service, and a premium dining flow.</div>
      <div class="small">From cozy dinners to busy weekends, Spice &amp; Bites gives your guests an elegant and effortless ordering journey.</div>
    </div>
    <div class="featured-strip">
      <div class="feature-pill"><strong>Fast Ordering</strong><span>Simple guest and member flow</span></div>
      <div class="feature-pill"><strong>Live Tracking</strong><span>Orders, status, and history in one place</span></div>
      <div class="feature-pill"><strong>Admin Control</strong><span>Manage menu, tickets, and customers discreetly</span></div>
    </div>
    <div class="role-grid">
      <div class="role-card" data-go="customer-auth">
        <div class="num">01 / DINING EXPERIENCE</div>
        <h3>Start your order</h3>
        <p>Browse the menu, build your order, and enjoy a clean, modern ordering experience as a guest or a registered member.</p>
        <div class="go">Enter dining room →</div>
      </div>
    </div>
  </div>`);
}

/* =========================================================
   CUSTOMER AUTH
   ========================================================= */
let authTab = 'login';
function renderCustomerAuth(){
  go(`
  <div class="screen">
    <button class="backlink" data-go="home">&larr; Back</button>
    <div class="panel" style="max-width:460px;margin:0 auto;">
      <div class="panel-title">Dining Room</div>
      <div class="panel-sub">Sign in, register, or order as a guest.</div>
      <div class="tabs">
        <button class="tab-btn ${authTab==='login'?'active':''}" data-authtab="login">Log In</button>
        <button class="tab-btn ${authTab==='register'?'active':''}" data-authtab="register">Register</button>
        <button class="tab-btn ${authTab==='guest'?'active':''}" data-authtab="guest">Guest</button>
      </div>
      <div id="auth-body"></div>
    </div>
  </div>`);
  renderAuthBody();
}
function renderAuthBody(){
  const body = document.getElementById('auth-body');
  if(authTab==='login'){
    body.innerHTML = `
      <form id="login-form">
        <div class="field"><label>Email</label><input type="email" name="email" required></div>
        <div class="field"><label>Password</label><input type="password" name="password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Log In</button>
      </form>`;
    document.getElementById('login-form').onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = fd.get('email').trim(), pw = fd.get('password');
      const cust = S.customers.find(c=>c.email===email && c.password===pw);
      if(cust){ S.currentCustomer = cust; toast('Logged in as '+cust.name); renderCustomerDash(); }
      else toast('Invalid email or password', 'err');
    };

function renderOrderScreen(){
  S.cart = S.cart || [];
  const isGuest = S.currentCustomer.guest;
  go(`

    <button class="backlink" data-go="${isGuest?'home':'customer-dash'}">&larr; Back</button>
    <h2 style="margin-bottom:4px;">Build Your Order</h2>

      </div>
      <div class="cart-box panel">

        <div id="cart-list"></div>
        <div class="divider"></div>
        <button class="btn btn-primary btn-block" id="checkout-btn">Checkout</button>
      </div>
    </div>
  </div>`);
  renderMenuGrid(); renderCartList();
  document.getElementById('checkout-btn').onclick = openCheckout;
}
function renderMenuGrid(){
  const grid = document.getElementById('menu-grid');
  const foods = Object.keys(S.menu);
  if(foods.length===0){ grid.innerHTML = `<div class="empty-state">No dishes on the menu yet.</div>`; return; }
  grid.innerHTML = foods.map(f=>{
    const inCart = S.cart.find(o=>o.food===f);
    const qty = inCart ? inCart.quantity : 0;
    return `<div class="food-card">
      <h4>${f}</h4>
      <div class="price">${money(S.menu[f])}</div>
      <div class="qty-row">
        <button class="qty-btn" data-cart-dec="${f}">−</button>
        <span class="qty-val">${qty}</span>
        <button class="qty-btn" data-cart-inc="${f}">+</button>
      </div>
    </div>`;
  }).join('');
  grid.querySelectorAll('[data-cart-inc]').forEach(b=>b.onclick=()=>{ cartChange(b.dataset.cartInc, 1); });
  grid.querySelectorAll('[data-cart-dec]').forEach(b=>b.onclick=()=>{ cartChange(b.dataset.cartDec, -1); });
}
function cartChange(food, delta){
  let item = S.cart.find(o=>o.food===food);
  if(!item){
    if(delta>0) S.cart.push({food, price:S.menu[food], quantity:1});
  } else {
    item.quantity += delta;
    if(item.quantity<=0) S.cart = S.cart.filter(o=>o.food!==food);
  }
  renderMenuGrid(); renderCartList();
}
function renderCartList(){
  const list = document.getElementById('cart-list');
  if(S.cart.length===0){ list.innerHTML = `<div class="empty-note">No items yet — add something from the menu.</div>`; return; }
  list.innerHTML = S.cart.map(o=>`
    <div class="cart-item">
      <div><div>${o.food}</div><div class="meta">${o.quantity} × ${money(o.price)}</div></div>
      <div>${money(o.price*o.quantity)}</div>
    </div>`).join('');
}

/* ---------- Checkout modal ---------- */
function openCheckout(){
  if(S.cart.length===0){ toast('Your order is empty', 'err'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box panel">
      <div class="panel-title">Select Payment Method</div>
      <div class="panel-sub">This will finalize and print your ticket.</div>
      <div class="field">
        <select id="pay-method">
          <option>Cash</option><option>Card</option><option>Jazzcash</option><option>Easypaisa</option>
        </select>
      </div>
      <div class="row-actions">
        <button class="btn btn-primary" id="confirm-pay">Confirm &amp; Pay</button>
        <button class="btn btn-outline" id="cancel-pay">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cancel-pay').onclick = ()=>overlay.remove();
  document.getElementById('confirm-pay').onclick = ()=>{
    const method = document.getElementById('pay-method').value;
    overlay.remove();
    finalizeOrder(method);
  };
}
function finalizeOrder(method){
  const c = S.currentCustomer;
  let grand = S.cart.reduce((s,o)=>s+o.price*o.quantity,0);
  let discount = 0;
  if(!c.guest){
    if(grand>=5000) discount=10; else if(grand>=2000) discount=5;
  }
  const discountAmt = grand*discount/100;
  const afterDiscount = grand - discountAmt;
  const taxPct = grand>0 ? 5 : 0;
  const taxAmt = afterDiscount*taxPct/100;
  const final = afterDiscount + taxAmt;
  const orderNumber = nextOrderNumber();
  const record = {
    order_number: orderNumber,
    customer: c.name,
    customer_id: c.customer_id || null,
    items: S.cart,
    payment_method: method,
    subtotal: grand,
    discount, discount_amount: discountAmt,
    tax_percentage: taxPct, tax_amount: taxAmt,
    final_bill: Math.round(final*100)/100,
    status: 'Pending'
  };
  S.orders.push(record);
  saveState();
  showTicket(record, c.guest);
  S.cart = [];
}

  go(`
  <div class="screen" style="max-width:460px;margin:0 auto;">
    <div class="ticket">
      <div class="ticket-head">
        <div><h3>Order #${order.order_number}</h3><div style="font-family:var(--font-mono);font-size:11px;color:#6b6650;">${order.customer}</div></div>
        <div class="tag">${order.payment_method}</div>
      </div>
      <div style="margin-bottom:10px; font-family:var(--font-mono); font-size:12px; color:#6b6650;">Guest Order Ref: #${order.order_number}</div>
      ${order.items.map(i=>`<div class="ticket-row"><span>${i.food} × ${i.quantity}</span><span>${money(i.price*i.quantity)}</span></div>`).join('')}
      <div class="ticket-row"><span>Subtotal</span><span>${money(order.subtotal)}</span></div>
      <div class="ticket-row"><span>Discount (${order.discount}%)</span><span>-${money(order.discount_amount)}</span></div>
      <div class="ticket-row"><span>Tax (${order.tax_percentage}%)</span><span>+${money(order.tax_amount)}</span></div>
      <div class="ticket-row total"><span>Total</span><span>${money(order.final_bill)}</span></div>

  };
}

/* =========================================================
   GLOBAL NAV / EVENT DELEGATION
   ========================================================= */
document.addEventListener('click', (e)=>{
  const tab = e.target.closest('[data-authtab]');
  if(tab){ authTab = tab.dataset.authtab; renderAuthBody(); document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); return; }

  const g = e.target.closest('[data-go]');
  if(g){
    const dest = g.dataset.go;
    routeTo(dest);
    return;
  }
  const act = e.target.closest('[data-action]');
  if(act && act.dataset.action==='logout'){ S.currentCustomer=null; renderHome(); }
});

function routeTo(dest){
  switch(dest){
    case 'home': renderHome(); break;
    case 'customer-auth': authTab='login'; renderCustomerAuth(); break;
    case 'admin-login': renderAdminLogin(); break;
    case 'customer-dash': renderCustomerDash(); break;
    case 'order': renderOrderScreen(); break;
    case 'history': renderHistory(); break;
    case 'profile': showPw=false; renderProfile(); break;
    case 'edit-profile': renderEditProfile(); break;
    default: renderHome();
  }
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  await loadState();
  renderHome();
})();
</script>
</body>
</html>
